# Lista de clientes (perfiles de org) del equipo. Viaja con el paquete y está en Git:
# NUNCA pongas client_secret acá. Cada secret se lee de la variable de entorno de usuario
# indicada en client_secret_env (se distribuyen con `genesys-mcp secrets export/import`).
#
# Para agregar o cambiar un cliente: editá este archivo, subí la versión y que el equipo
# corra `uv tool upgrade genesys-ops-mcp`.
#
# Regiones: sa-east-1 = São Paulo, us-east-1 = US East, mx-central-1 = México.
# environment: lab | dev | qa | prod.  aliases: nombres alternativos (únicos entre todas las orgs).
# read_only = true bloquea toda escritura; allow_delete = false bloquea los DELETE.

# ---------------------------------------------------------------- Laboratorio

[orgs.lab]
display_name = "Laboratorio InfoSys"
environment = "lab"
aliases = ["laboratorio", "informationsystems"]
description = "Org de laboratorio (Information Systems)"
region = "us-east-1"
client_id = "2523cffa-62f1-458c-9b72-ee4681dc7f2c"
client_secret_env = "GENESYS_LAB"
read_only = false
allow_delete = true

