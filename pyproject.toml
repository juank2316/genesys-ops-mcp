[project]
name = "genesys-ops-mcp"
version = "0.2.0"
description = "MCP server para administrar y operar orgs de Genesys Cloud desde Claude"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
    "cryptography>=43",
]

[project.scripts]
genesys-mcp = "genesys_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genesys_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
